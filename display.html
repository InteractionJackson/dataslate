<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Data Slate Display</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body class="display">
    <!-- assets/skull.svg inlined once, so fx.js can change the eyes on every copy of the skull at once. -->
    <svg class="skull-defs" aria-hidden="true" focusable="false" width="0" height="0">
      <path id="skull-outline" d="M22.0529 59.4592C11.2183 57.7859 3.9238 49.4197 3.11925 37.8688C2.10016 26.156 7.67834 13.7956 17.3329 7.69627C23.5011 3.75603 31.0102 2.35266 38.1438 3.27025C48.1738 3.81001 57.882 10.1252 63.7283 19.3551C69.3602 28.2611 70.6474 37.2211 66.6247 46.6129C63.2992 54.3854 57.1847 58.4876 48.6565 59.783C47.9725 62.5609 48.6754 67.9642 44.1469 67.9642C39.6183 67.9642 39.5667 63.5745 39.6456 59.9989C39.2472 63.425 39.5383 67.9642 34.9256 67.7175C30.3375 67.7175 31.0969 63.0142 30.9565 60.5387C30.5325 63.8098 30.7487 68.2033 26.3719 68.2033C21.9188 68.2033 22.0969 63.0142 22.0529 59.4592Z" fill="none" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" stroke="#11FF00" />
      <path id="skull-eyes" d="M31.2261 45.4653C31.6552 50.1612 28.5443 54.0475 24.1461 54.3174C19.6943 54.5872 16.3152 51.5106 15.8861 46.9766C15.4034 42.2807 18.3534 38.1786 22.3225 37.6928C26.6134 37.207 30.7434 40.6075 31.2261 45.4653ZM55.5234 45.5193C55.3625 49.8374 51.9298 53.2378 47.5316 53.2918C43.348 53.3998 40.0225 50.4311 39.808 46.5448C39.5398 42.1188 43.0798 38.1786 46.888 37.7468C51.0716 37.261 55.738 40.6615 55.5234 45.5193Z" fill="#11FF00" />
    </svg>
    <!-- The spectator view: display.html?room=CODE. Read-only — display.js has no write calls, and database.rules.json
         only lets the two seated players write, so a display can't change the score even from dev tools. -->
    <main class="board">
      <p class="board__status" data-status role="status" hidden>Reconnecting…</p>

      <header class="board__header">
        <div class="board__meta">
          <span class="card__label">Room</span>
          <span class="board__meta-value board__code" data-code>····</span>
        </div>
        <span class="glitch" data-glitch>
          <svg class="slate__mark" aria-hidden="true" focusable="false" viewBox="0 0 72 72" width="72" height="72"><use href="#skull-outline" /><use href="#skull-eyes" /></svg>
          <svg class="glitch__slice" aria-hidden="true" focusable="false" viewBox="0 0 72 72" width="72" height="72"><use href="#skull-outline" /><use href="#skull-eyes" /></svg>
          <svg class="glitch__slice" aria-hidden="true" focusable="false" viewBox="0 0 72 72" width="72" height="72"><use href="#skull-outline" /><use href="#skull-eyes" /></svg>
        </span>
        <div class="board__meta board__meta--end">
          <span class="card__label">Round</span>
          <span class="board__meta-value"><span data-round>1</span><span class="card__of">/5</span></span>
        </div>
      </header>

      <div class="board__players" data-players></div>
    </main>

    <div class="board__message" data-message hidden>
      <p class="board__message-text" data-message-text role="alert"></p>
      <form class="board__form" data-code-form hidden>
        <label class="field">
          <span class="field__label">Room code</span>
          <input class="field__input field__input--code" name="code" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="K7QX" required />
        </label>
        <button class="btn btn--primary" type="submit">Watch room</button>
      </form>
    </div>

    <!-- One column per seat; display.js clones this for p1 (left) and p2 (right). -->
    <template id="player-tpl">
      <section class="player">
        <h2 class="player__name"><span data-name></span><span class="player__tag" data-offline hidden>Offline</span></h2>
        <div class="player__empty" data-empty>
          <span>Join with code</span>
          <strong data-code></strong>
        </div>
        <div class="player__scores" data-scores hidden>
          <section class="card card--total">
            <h3 class="card__label">Total points</h3>
            <p class="card__value card__value--xl"><span data-field="total">0</span></p>
          </section>
          <div class="slate__row">
            <section class="card" data-counter="primary">
              <h3 class="card__label">Primary</h3>
              <p class="card__value card__value--md"><span data-field="primary">0</span></p>
            </section>
            <section class="card" data-counter="secondary">
              <h3 class="card__label">Secondary</h3>
              <p class="card__value card__value--md"><span data-field="secondary">0</span></p>
            </section>
            <section class="card" data-counter="cp">
              <h3 class="card__label">CP</h3>
              <p class="card__value card__value--md"><span data-field="cp">0</span></p>
            </section>
          </div>
        </div>
      </section>
    </template>

    <script src="firebase-config.js?v=2"></script>
    <script src="fx.js?v=1"></script>
    <script src="display.js?v=1"></script>
  </body>
</html>
